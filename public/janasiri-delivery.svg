<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 132" fill="none">
  <title>Janasiri delivery truck on the road</title>
  <defs>
    <linearGradient id="cargo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4eee2"/><stop offset="1" stop-color="#d8d5c3"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#df9278"/><stop offset="1" stop-color="#ae4f36"/>
    </linearGradient>
    <linearGradient id="fade">
      <stop stop-color="white" stop-opacity="0"/><stop offset=".15" stop-color="white"/><stop offset=".85" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="540" height="132" fill="url(#fade)"/></mask>
    <clipPath id="road"><rect x="0" y="117" width="540" height="10"/></clipPath>
  </defs>
  <style>
    .landscape{animation:landscape 12s linear infinite}
    .lane{animation:lane 1.4s linear infinite}
    .vehicle{animation:drive 7s ease-in-out infinite}
    .body{animation:bounce 1.6s ease-in-out infinite}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}
    @keyframes landscape{to{transform:translateX(-270px)}}
    @keyframes lane{to{transform:translateX(-66px)}}
    @keyframes drive{0%,100%{transform:translateX(-18px)}50%{transform:translateX(22px)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.landscape,.lane,.vehicle,.body,.wheel{animation:none}}
  </style>
  <g mask="url(#edge)">
    <g class="landscape" stroke="#85937a" stroke-opacity=".34" stroke-width="1.4" stroke-linejoin="round">
      <g id="scene">
        <path d="M0 108H270M8 108V70L48 42L88 70V108M8 70H88M23 108V82H43V108M55 108V82H73V108M110 108V84H132V108M138 108V75L168 54L199 75V108M148 108V87H188V108M225 108V87M213 94L225 65L237 94H213Z"/>
        <path d="M0 102L50 79L90 98L135 66L181 91L220 72L270 102" opacity=".38"/>
      </g>
      <use href="#scene" x="270"/><use href="#scene" x="540"/>
    </g>
    <path d="M0 114H540" stroke="#b5bba8" stroke-opacity=".38" stroke-width="1.4"/>
    <g clip-path="url(#road)" class="lane" stroke="#d7c9ab" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
      <path d="M0 123h28m38 0h28m38 0h28m38 0h28m38 0h28m38 0h28m38 0h28m38 0h28m38 0h28m38 0h28"/>
    </g>
  </g>
  <g class="vehicle">
    <ellipse cx="274" cy="111" rx="107" ry="5" fill="#101510" opacity=".55"/>
    <g class="body">
      <path d="M174 90h172v13H174z" fill="#8d9b80"/>
      <rect x="170" y="25" width="126" height="72" rx="6" fill="url(#cargo)"/>
      <rect x="176" y="31" width="114" height="60" rx="3" stroke="#89917e" stroke-opacity=".4"/>
      <path d="M171 80h124v12H171z" fill="#647454"/>
      <path d="M299 49h29l24 25v24h-53z" fill="url(#cab)"/>
      <path d="M305 55h19l17 19h-36z" fill="#263b36" stroke="#edb49e" stroke-width="1.5"/>
      <path d="M320 56v17" stroke="#9cae9c" stroke-width="1.2"/>
      <path d="M307 80h11" stroke="#733d2c" stroke-width="2" stroke-linecap="round"/>
      <rect x="345" y="84" width="9" height="6" rx="2" fill="#f4e0b8"/>
      <rect x="168" y="87" width="5" height="7" rx="1" fill="#d37961"/>
      <path d="M299 98h56v5h-56z" fill="#adba9b"/>
      <g transform="translate(184 41)">
        <path d="M0 7l11-6 11 6v13l-11 6-11-6z" fill="#b95f43"/>
        <path d="M0 7l11 6 11-6M11 13v13M5 4l11 6" stroke="#f5eee0" stroke-width="1.2" stroke-linejoin="round"/>
        <text x="30" y="12" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#354235" letter-spacing=".9">JANASIRI</text>
        <text x="30" y="24" font-family="Arial,sans-serif" font-size="7.5" font-weight="600" fill="#647454" letter-spacing="1">DISTRIBUTORS</text>
      </g>
    </g>
    <g transform="translate(203 103)">
      <circle r="13" fill="#151c19" stroke="#717e6b" stroke-width="1.8"/>
      <g class="wheel"><circle r="6.4" fill="#a5ae99"/><path d="M0-5.5V5.5M-5.5 0H5.5M-4-4L4 4M-4 4L4-4" stroke="#475349" stroke-width="1.2"/><circle r="2" fill="#e4e4d5"/></g>
    </g>
    <g transform="translate(327 103)">
      <circle r="13" fill="#151c19" stroke="#717e6b" stroke-width="1.8"/>
      <g class="wheel"><circle r="6.4" fill="#a5ae99"/><path d="M0-5.5V5.5M-5.5 0H5.5M-4-4L4 4M-4 4L4-4" stroke="#475349" stroke-width="1.2"/><circle r="2" fill="#e4e4d5"/></g>
    </g>
  </g>
</svg>